# ==============================================================================
# Nav2 params — landmark-to-landmark navigation WITH 3D obstacle avoidance
# Robot: 0.56 m track diff-drive, OAK-D Lite at 1.24 m, RTAB-Map localization
#
# Obstacles come from /obstacles_cloud (depth -> 3D -> height split), NOT /scan.
# Free space is cleared using /ground_cloud.
# Both local AND global costmaps see live obstacles, so the planner replans
# AROUND them (1 Hz) instead of the controller just stopping in front.
#
# !!! MEASURE YOUR ROBOT and fix FOOTPRINT below (base_link = centre of drive axle,
#     +x forward, +y left). Current values: 0.72 m long x 0.66 m wide.
# ==============================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Custom BT: replans 1 Hz, recoveries = clear costmaps + wait (NO spin / NO backup,
    # the robot is 0.66 m wide and has no rear sensing).
    default_nav_to_pose_bt_xml: "/home/krishna/mapping_ws/src/esp32_odom_bridge/config/navigate_landmarks_bt.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    enable_stamped_cmd_vel: false
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12      # was 0.10: tighter than localization noise (~5-10 cm jumps) -> hunting
      yaw_goal_tolerance: 0.17     # ~10 deg (was 6): min turn speed 0.18 rad/s + ~0.4 s latency overshot a +-6 deg band
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15      # was 0.18
      lookahead_dist: 0.60
      min_lookahead_dist: 0.45     # was 0.35: weaving +-0.25 rad/s
      max_lookahead_dist: 0.90
      lookahead_time: 2.0
      rotate_to_heading_angular_vel: 0.22   # was 0.30: less overshoot on the final heading
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: false   # 2026-11-19: 755 false 'collision ahead' stops per lap; collision_monitor (FootprintApproach + PolygonStop) is the safety layer
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.06
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.60
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # measured: base_link = drive-wheel axle; front edge +0.42, rear edge -0.10, half-width 0.30 (track 0.546 + wheel)
      footprint: "[[0.42, 0.30], [0.42, -0.30], [-0.10, -0.30], [-0.10, 0.30]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      transform_tolerance: 0.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        # 3D memory: floor rays pass OVER low objects instead of erasing them, so a stand/box
        # seen from 2 m stays marked after it drops below the camera's view up close.
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.60
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        enabled: True
        footprint_clearing_enabled: True
        combination_method: 1
        observation_sources: obstacles ground
        obstacles:
          topic: /obstacles_cloud
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.08
          max_obstacle_height: 1.60
          obstacle_min_range: 0.0
          obstacle_max_range: 2.8
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
        ground:
          topic: /ground_cloud
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.30
          max_obstacle_height: 0.30
          obstacle_max_range: 2.8
          raytrace_max_range: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45      # was 0.55: desk-lined corridors were closing up
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # measured: base_link = drive-wheel axle; front edge +0.42, rear edge -0.10, half-width 0.30 (track 0.546 + wheel)
      footprint: "[[0.42, 0.30], [0.42, -0.30], [-0.10, -0.30], [-0.10, 0.30]]"
      footprint_padding: 0.04      # planner keeps 4 cm extra (6 cm made 'Start occupied' next to furniture) (incl. turn-in-place sweep) so live camera noise
                                   # + ~5 cm localization error does not make RPP refuse the planned path
      resolution: 0.05
      track_unknown_space: true
      # Saved map only: live camera marks (people, phantoms) persisted here and caused detours.
      # Live obstacles are handled by the local costmap + controller + collision monitor (stop & wait).
      plugins: ["static_layer", "inflation_layer"]
      transform_tolerance: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map_nav          # 5 cm copy of RTAB-Map's 3 cm /map (map_downsampler)
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        # 3D memory: floor rays pass OVER low objects instead of erasing them, so a stand/box
        # seen from 2 m stays marked after it drops below the camera's view up close.
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.60
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: obstacles ground
        obstacles:
          topic: /obstacles_cloud
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.08
          max_obstacle_height: 1.60
          obstacle_max_range: 2.0
          raytrace_max_range: 3.0
        ground:
          topic: /ground_cloud
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.30
          max_obstacle_height: 0.30
          obstacle_max_range: 2.8
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.60      # >= circumscribed radius incl. padding (0.572) (Smac Hybrid footprint checks); steep decay keeps corridors open
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      # Smac State-Lattice, diff-drive primitives: footprint-aware AND can turn in place
      # (Hybrid-A* DUBIN could not U-turn in narrow corridors -> 20 m detours / "no valid path")
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      terminal_checking_interval: 5000
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.40
    min_rotational_vel: 0.30
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 2000

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    enable_stamped_cmd_vel: false
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.40]
    min_velocity: [-0.05, 0.0, -0.40]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.6, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # NO deadband: RPP ramps rotation from 0 in small steps; firmware soft-start handles crawl
    velocity_timeout: 0.5

# Last line of defence: hard stop if anything enters the box in front of the robot.
# Output /cmd_vel_safe is what odom_bridge_node forwards to the ESP32.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0          # camera cloud stale for 1 s -> robot stops
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Approach: projects the robot outline along the CURRENT command (incl. turning) and slows so it
    # never reaches anything within 1.2 s. Mapped objects beside a curved path no longer trigger it.
    polygons: ["FootprintApproach", "PolygonStop"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.47, 0.34], [0.47, -0.34], [-0.15, -0.34], [-0.15, 0.34]]"   # outline + 4-5 cm
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 4
      visualize: True
      polygon_pub_topic: "polygon_approach"
      enabled: True
    PolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 4
      visualize: True
      enabled: True
      polygon_pub_topic: "polygon_stop"
      holonomic: false
      velocity_polygons: ["rotation", "forward", "backward", "stopped"]
      rotation:          # turning on the spot: only what the robot's corners actually sweep (r = 0.544 m)
        points: "[[0.58, 0.24], [0.24, 0.58], [-0.24, 0.58], [-0.58, 0.24], [-0.58, -0.24], [-0.24, -0.58], [0.24, -0.58], [0.58, -0.24]]"
        linear_min: -0.03
        linear_max: 0.03
        theta_min: -1.5
        theta_max: 1.5
      forward:           # last-resort hard stop: 13 cm beyond the front edge (was 33 cm -> stopped
                         # for mapped desks the planned path passes beside in tight spots)
        points: "[[0.55, 0.32], [0.55, -0.32], [0.0, -0.32], [0.0, 0.32]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.5
        theta_max: 1.5
      backward:
        points: "[[0.0, 0.32], [0.0, -0.32], [-0.30, -0.32], [-0.30, 0.32]]"
        linear_min: -1.0
        linear_max: 0.0
        theta_min: -1.5
        theta_max: 1.5
      stopped:
        points: "[[0.45, 0.33], [0.45, -0.33], [-0.13, -0.33], [-0.13, 0.33]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -1.5
        theta_max: 1.5
    PolygonSlow:
      type: "polygon"
      points: "[[1.20, 0.40], [1.20, -0.40], [0.0, -0.40], [0.0, 0.40]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      visualize: True
      polygon_pub_topic: "polygon_slow"
      enabled: False
    observation_sources: ["obstacles"]
    obstacles:
      type: "pointcloud"
      topic: "/obstacles_cloud"
      min_height: 0.08
      max_height: 1.60
      enabled: True

# Required by this Nav2 version's navigation_launch (lifecycle aborts without them).
# No charging dock is used; config only lets the nodes configure.
route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
