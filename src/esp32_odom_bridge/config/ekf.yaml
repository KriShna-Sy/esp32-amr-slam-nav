# ==============================================================================
# Extended Kalman Filter (EKF) Configuration for Differential-Drive Robot
# Fuses ESP32 Wheel Odometry (/wheel_odom) + OAK-D IMU (/oak/imu/data)
# Produces /odometry/filtered and publishes continuous odom -> base_link TF
# ==============================================================================

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.15
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # --------------------------------------------------------------------------
    # Sensor 1: ESP32 Wheel Odometry (/wheel_odom)
    # --------------------------------------------------------------------------
    # Matrix: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # --------------------------------------------------------------------------
    # Sensor 2: Calibrated OAK Camera IMU (/oak/imu/data)
    # Calibrated zero-bias Gyroscope aligned with ROS body frame (Z = Yaw rate)
    # --------------------------------------------------------------------------
    imu0: /oak/imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
